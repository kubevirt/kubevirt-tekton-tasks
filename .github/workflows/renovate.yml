# Scheduled Renovate workflow for dependency updates.
#
# Uses a GitHub App to generate short-lived tokens with the
# necessary permissions (contents:write, pull-requests:write).
# Renovate creates branches directly in this repo and opens PRs.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   RENOVATE_APP_ID          - GitHub App ID
#   RENOVATE_APP_PRIVATE_KEY - GitHub App private key (PEM)

name: Renovate

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Run Renovate
        uses: renovatebot/github-action@v46.1.16
        with:
          configurationFile: renovate.json
          token: ${{ steps.app-token.outputs.token }}
        env:
          LOG_LEVEL: info
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ALLOWED_COMMANDS: '["make vendor", "make test"]'
