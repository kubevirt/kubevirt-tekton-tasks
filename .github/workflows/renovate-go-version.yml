name: Renovate Go version report

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: renovate-go-version-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  report-go-version-change:
    if: >-
      ${{
        github.actor == 'kubevirt-renovate[bot]' &&
        github.event.pull_request.user.login == 'kubevirt-renovate[bot]' &&
        startsWith(github.head_ref, 'renovate/') &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check Go version directives
        id: check-go-version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPORT_FILE: ${{ runner.temp }}/go-version-report.md
        run: |
          python3 scripts/check-go-version-bump.py "$BASE_SHA" "$HEAD_SHA" > "$REPORT_FILE"

          if [[ -s "$REPORT_FILE" ]]; then
            changed=true
          else
            changed=false
          fi

          delimiter="$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          {
            echo "changed=$changed"
            echo "report<<$delimiter"
            cat "$REPORT_FILE"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Replace Go version comment
        uses: actions/github-script@v9
        env:
          HAS_CHANGES: ${{ steps.check-go-version.outputs.changed }}
          REPORT: ${{ steps.check-go-version.outputs.report }}
        with:
          script: |
            const marker = '<!-- renovate-go-version-directive-report -->';
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (comment) =>
                comment.user?.login === 'github-actions[bot]' &&
                comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.deleteComment({
                owner,
                repo,
                comment_id: existing.id,
              });
            }

            if (process.env.HAS_CHANGES === 'true') {
              const body = `${marker}\n\n${process.env.REPORT.trim()}`;
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
